apiVersion: v1
kind: Pod
metadata:
  name: {{ include "pob.name" (dict "ctx" . "component" "test-api") }}
  labels:
    {{- include "pob.labels" (dict "ctx" . "component" "test") | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    # Kept after success so `helm test --logs` can read it; replaced on the next run.
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: readyz
      image: {{ include "pob.image" .Values.images.service }}
      imagePullPolicy: {{ .Values.images.service.pullPolicy }}
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      command:
        - python
        - -c
        - |
          import json, urllib.request
          base = "http://{{ include "pob.name" (dict "ctx" . "component" "service") }}:{{ .Values.service.port }}"
          assert urllib.request.urlopen(base + "/readyz", timeout=10).status == 200
          print(json.load(urllib.request.urlopen(base + "/stats", timeout=10)))
