name: build

# On merge to main: build both images, scan with Trivy (fail on fixable
# CRITICAL vulnerabilities), push to GitHub Container Registry tagged with the
# commit SHA (and latest).

on:
  push:
    branches: [main]
    paths: ["service/**", "rail/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [service, rail]
    steps:
      - uses: actions/checkout@v7

      - name: Image name (GHCR needs lower case)
        id: img
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/proofofbalance-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component }}
          load: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Trivy scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.name }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push
        run: |
          docker tag "${{ steps.img.outputs.name }}:${{ github.sha }}" "${{ steps.img.outputs.name }}:latest"
          docker push "${{ steps.img.outputs.name }}:${{ github.sha }}"
          docker push "${{ steps.img.outputs.name }}:latest"
          echo "Pushed ${{ steps.img.outputs.name }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
