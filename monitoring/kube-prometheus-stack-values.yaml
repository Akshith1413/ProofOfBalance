# kube-prometheus-stack sized for one t3.medium running k3s.
# Installed by scripts/setup.sh as release "kube-prometheus-stack" in namespace
# "monitoring", so Prometheus is at kube-prometheus-stack-prometheus.monitoring:9090
# (the address the Argo AnalysisTemplate queries).
# Alertmanager receivers and the Grafana password are passed in a second,
# generated values file (.secrets/monitoring-values.yaml) so no secret lives here.

# k3s does not expose these components; scraping them only produces false alerts.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Pick up PodMonitors / PrometheusRules from every namespace, not just ours.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 900Mi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 96Mi }

grafana:
  defaultDashboardsTimezone: utc
  # Read-only dashboards without a login. Safe because Grafana is a ClusterIP
  # service, reachable only through `kubectl port-forward` (your kubeconfig).
  grafana.ini:
    auth.anonymous: { enabled: true, org_role: Viewer }
  persistence: { enabled: false }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 320Mi }
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

prometheusOperator:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }
