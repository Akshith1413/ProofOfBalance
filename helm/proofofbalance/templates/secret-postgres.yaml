{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pob.name" (dict "ctx" . "component" "postgres") }}
  labels:
    {{- include "pob.labels" (dict "ctx" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgres.password is required when postgres.existingSecret is empty" .Values.postgres.password | quote }}
{{- end }}
