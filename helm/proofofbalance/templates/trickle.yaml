{{- if .Values.trickle.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pob.name" (dict "ctx" . "component" "trickle") }}
  labels:
    {{- include "pob.labels" (dict "ctx" . "component" "trickle") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pob.selector" (dict "ctx" . "component" "trickle") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pob.labels" (dict "ctx" . "component" "trickle") | nindent 8 }}
    spec:
      {{- include "pob.podSpecCommon" . | nindent 6 }}
      containers:
        - name: trickle
          image: {{ include "pob.image" .Values.images.service }}
          imagePullPolicy: {{ .Values.images.service.pullPolicy }}
          command: ["python", "-m", "app.trickle"]
          env:
            - { name: SERVICE_URL, value: "http://{{ include "pob.name" (dict "ctx" . "component" "service") }}:{{ .Values.service.port }}" }
            - { name: TRICKLE_RPS, value: {{ .Values.trickle.rps | quote }} }
            - { name: TRICKLE_FILE, value: /traffic/day1.jsonl.gz }
          resources:
            {{- toYaml .Values.trickle.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - { name: traffic, mountPath: /traffic, readOnly: true }
      volumes:
        - name: traffic
          {{- if .Values.trickle.trafficConfigMap }}
          configMap:
            name: {{ .Values.trickle.trafficConfigMap }}
            optional: true
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
